name: Publish to PyPI

# Trigger: a GitHub Release was published OR a manual rerun.
# Build the wheel + sdist and upload via PyPI's trusted-publishing
# (OIDC) so no PyPI API token is stored in repo secrets.
#
# Pre-requisites (configured once, not in this workflow):
#   1. PyPI trusted publisher entry for this repo + workflow + env:
#        https://pypi.org/manage/project/n3memorycore-mcp-lite/settings/publishing/
#   2. GitHub Environment "pypi" in repo settings:
#        https://github.com/NeuralNexusNote/n3mcmcp-lite/settings/environments
#
# Both were already in place when V1.1.0 shipped via this same workflow
# on 2026-04-19; this file restores the workflow that was accidentally
# removed between V1.1.0 and v1.6.0.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/n3memorycore-mcp-lite
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify distribution metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Publish to PyPI via OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
