name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    # Redis Stack as a sidecar — RediSearch is required and only DB 0 is
    # indexable, so we point N3MC_REDIS_TEST_URL at db=0 (conftest.py
    # FLUSHDBs it before/after each test, hence "dedicated container only").
    services:
      redis-stack:
        image: redis/redis-stack-server:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      N3MC_REDIS_TEST_URL: redis://localhost:6379/0
      # Pin HF cache so the embedding model is reused across runs.
      HF_HOME: ~/.cache/huggingface
      # Avoid sentence-transformers' progress bars on stdout (matters for
      # the stdio reconfigure tests, harmless elsewhere).
      TRANSFORMERS_VERBOSITY: error
      HF_HUB_DISABLE_PROGRESS_BARS: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-e5-base-v2-${{ runner.os }}-v1

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify Redis Stack reachability
        run: |
          python - <<'PY'
          import redis
          r = redis.Redis.from_url("redis://localhost:6379/0")
          print("Redis ping:", r.ping())
          print("Redis info:", r.info("server")["redis_version"])
          PY

      - name: Run pytest
        run: pytest tests/ -q

  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build distributions
        run: python -m build --wheel --sdist

      - name: twine check
        run: python -m twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
