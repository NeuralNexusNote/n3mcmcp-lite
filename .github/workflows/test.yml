name: Tests

# Trigger on push / PR to main, plus manual dispatch from the Actions UI
# for ad-hoc reruns.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel an older run if a new commit lands on the same branch — saves
# minutes and prevents two consecutive pushes from each tying up a runner.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Single-runner workflow on purpose. The earlier 4-Python-version
    # matrix x 5 jobs setup repeatedly hit "The job was not acquired by
    # Runner of type hosted even after multiple attempts" failures from
    # GitHub's runner allocator, while the V1.1.0 single-runner Publish
    # workflow always succeeded. We trade matrix breadth for reliability;
    # local pytest still runs across all four Python versions per
    # CONTRIBUTING.md, and matrix can be re-introduced later once the
    # account's runner allocation is confirmed healthy.
    name: pytest + build (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Redis Stack as a sidecar — RediSearch is required and only DB 0 is
    # indexable, so we point N3MC_REDIS_TEST_URL at db=0 (conftest.py
    # FLUSHDBs it before/after each test, hence "dedicated container only").
    services:
      redis-stack:
        image: redis/redis-stack-server:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      N3MC_REDIS_TEST_URL: redis://localhost:6379/0
      # Pin HF cache so the embedding model is reused across runs.
      HF_HOME: ~/.cache/huggingface
      # Avoid sentence-transformers' progress bars on stdout (matters for
      # the stdio reconfigure tests, harmless elsewhere).
      TRANSFORMERS_VERBOSITY: error
      HF_HUB_DISABLE_PROGRESS_BARS: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5-base-${{ runner.os }}-v1

      - name: Install package + dev deps + build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install build twine

      - name: Verify Redis Stack reachability
        run: |
          python - <<'PY'
          import redis
          r = redis.Redis.from_url("redis://localhost:6379/0")
          print("Redis ping:", r.ping())
          print("Redis info:", r.info("server")["redis_version"])
          PY

      - name: Run pytest
        run: pytest tests/ -q

      - name: Build wheel + sdist
        run: python -m build --wheel --sdist

      - name: twine check
        run: python -m twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
