[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "n3memorycore-mcp-lite"
version = "2.0.0"
description = "N3MemoryCore MCP Lite - ephemeral 7-day hybrid-search memory over Redis Stack"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "NeuralNexusNote" }]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "redis>=5.0.0,<8.0.0",
    "sentence-transformers>=2.7.0",
    "uuid-utils>=0.6.0",
    "platformdirs>=4.0.0",
    "numpy>=1.26.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]

[project.scripts]
n3mc-workingmemory = "n3mc_mcp.__main__:run"
n3mc-mcp-lite = "n3mc_mcp.__main__:run"
n3mc-lite = "n3mc_mcp.cli:main"
n3mc-lite-hook = "n3mc_mcp.lite_hook:main"
n3mc-lite-stop-hook = "n3mc_mcp.lite_stop_hook:main"

[tool.hatch.build.targets.wheel]
packages = ["n3mc_mcp"]

[tool.pytest.ini_options]
markers = ["slow: loads the real embedding model"]
