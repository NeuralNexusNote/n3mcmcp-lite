[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "n3memorycore-mcp-lite"
version = "1.5.0"
description = "N3MemoryCore MCP Lite — ephemeral 7-day hybrid-search memory over Redis Stack"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "redis>=5.0.0",
    "sentence-transformers>=2.7.0",
    "uuid-utils>=0.6.0",
    "platformdirs>=4.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
n3mc-workingmemory = "n3mc_mcp.__main__:run"
n3mc-mcp-lite = "n3mc_mcp.__main__:run"

[tool.hatch.build.targets.wheel]
packages = ["n3mc_mcp"]
