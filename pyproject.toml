[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "n3memorycore-mcp-lite"
version = "1.1.4"
description = "N3MemoryCore MCP — Working Memory (Lite): ephemeral (Redis-backed, 7d TTL) hybrid (vector + BM25) working memory for Claude and other MCP clients"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "NeuralNexusNote" },
  { name = "ArnolfJp019" },
]
keywords = ["mcp", "working-memory", "memory", "rag", "claude", "anthropic", "redis", "redis-stack", "vector-search", "embedding", "ephemeral", "lite"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "mcp>=1.2.0",
  "redis>=5.0.0",
  "sentence-transformers>=2.7.0",
  "numpy>=1.24",
  "uuid-utils>=0.9.0",
  "platformdirs>=4.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
# Primary command — clarifies this is a working-memory server (vs. the Pro long-term memory server).
n3mc-workingmemory = "n3mc_mcp.__main__:main"
# Deprecated alias — kept for backward compatibility with 1.1.0–1.1.3 user configs.
# Will be removed in 1.2.0; please migrate to `n3mc-workingmemory`.
n3mc-mcp-lite = "n3mc_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/NeuralNexusNote/n3mcmcp-lite"
Issues = "https://github.com/NeuralNexusNote/n3mcmcp-lite/issues"

[tool.hatch.build.targets.wheel]
packages = ["n3mc_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
